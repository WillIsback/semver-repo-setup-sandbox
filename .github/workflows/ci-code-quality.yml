# Workflow : Qualité du code
# Python (ruff, mypy, lockfile) seulement si du Python ou ses dépendances
# changent ; titre de PR, actionlint et zizmor sur chaque PR (< 1 min).
name: ci-code-quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Fichiers modifiés
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.diff.outputs.python }}
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Détecter les changements Python
        id: diff
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ]; then echo "python=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE_SHA" HEAD \
            | grep -qE '\.py$|^pyproject\.toml$|^uv\.lock$|^\.github/workflows/ci-code-quality\.yml$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    name: ci-code-quality (Python)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv (cache des dépendances)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Dépendances (lockfile vérifié)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check --output-format=github .

      - name: Formatage (ruff)
        run: uv run ruff format --check .

      - name: Typage (mypy)
        run: uv run mypy

  meta:
    name: ci-code-quality (PR et workflows)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint du titre de PR (Conventional Commits)
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert)(\(.+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "❌ Titre non conforme à Conventional Commits : $PR_TITLE"
            exit 1
          fi
          echo "✅ Titre de PR valide."

      - name: Lint des workflows GitHub (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          # Binaire épinglé (v1.7.12) et vérifié par empreinte SHA-256.
          ACTIONLINT_VERSION=1.7.12
          ACTIONLINT_SHA256=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          TEMP_DIR=$(mktemp -d)
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$TEMP_DIR/actionlint.tar.gz"
          echo "${ACTIONLINT_SHA256}  $TEMP_DIR/actionlint.tar.gz" | sha256sum --check --strict -
          tar -xzf "$TEMP_DIR/actionlint.tar.gz" -C "$TEMP_DIR"
          "$TEMP_DIR/actionlint" -color
          rm -rf "$TEMP_DIR"

      - name: Installer uv (pour zizmor)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"

      - name: Analyse de sécurité des workflows (zizmor)
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Bloquant à partir de la sévérité « high » ; exceptions justifiées dans .github/zizmor.yml.
          uvx --no-build zizmor@1.31.0 --min-severity high --format sarif .github/workflows > zizmor.sarif

      - name: Upload SARIF zizmor
        if: ${{ always() && hashFiles('zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: zizmor.sarif
          category: "zizmor"

      - name: Échouer si zizmor signale un problème de sévérité élevée
        if: steps.zizmor.outcome == 'failure'
        run: |
          echo "❌ zizmor a signalé au moins un problème de sévérité « high »."
          exit 1
